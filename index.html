<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalOx POC Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#fleet">
      <svg width="40" height="30" viewBox="0 0 52 36" aria-hidden="true"><g fill="#1e9fd9"><circle cx="8" cy="6" r="4.5"/><circle cx="21" cy="6" r="4.5"/><circle cx="8" cy="18" r="4.5"/><circle cx="21" cy="18" r="4.5"/><circle cx="34" cy="18" r="4.5"/><circle cx="47" cy="18" r="4.5"/><circle cx="34" cy="30" r="4.5"/><circle cx="47" cy="30" r="4.5"/></g></svg>
      <span class="wordmark">CalOx</span>
      <span class="appname">POC scheduler</span>
    </a>
    <nav id="nav" aria-label="Main" hidden>
      <a href="#fleet" data-tab="fleet">Fleet</a>
      <a href="#calendar" data-tab="calendar">Calendar</a>
      <a href="#book" data-tab="book" data-roles="csr admin">Book a trip</a>
      <a href="#service" data-tab="service">Service portal</a>
      <a href="#admin" data-tab="admin" data-roles="admin">Admin</a>
    </nav>
    <div id="who" class="who" hidden>
      <span id="whoName"></span>
      <button id="signOut" class="btn btn-ghost" type="button">Sign out</button>
    </div>
  </div>
</header>
<main id="app" class="wrap" aria-live="polite">
  <p class="muted">Loading…</p>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
